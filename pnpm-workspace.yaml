packages:
  - 'backend'
  - 'frontend-react'

allowBuilds:
  '@clerk/shared': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  msgpackr-extract: true
  prisma: true

overrides:
  axios: '>=1.20.0'
  body-parser: '^1.20.9'
  brace-expansion@^2: '2.1.8'
  brace-expansion@^4: '5.1.0'
  brace-expansion@^5: '5.1.0'
  'minimatch@5>brace-expansion': '2.1.8'
  compression: '>=1.8.2'
  deepmerge-ts: '>=8.0.0'
  effect: '^3.22.5'
  fast-uri: '>=3.1.9'
  follow-redirects: '>=1.16.2'
  glob@>=9 <=14: '>=14.0.2'
  minimatch@>=7 <11: '>=11.0.1'
  morgan: '>=1.12.1'
  proxy-addr: '>=2.0.7'
  qs: '>=6.16.1'
  serialize-javascript: '>=7.1.3'
  sharp: '>=0.35.5'
  source-map-js: '>=1.2.2'
  uuid: '>=11.1.1'
  vite: '>=8.2.4'
